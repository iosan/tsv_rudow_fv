name: Build and Validate

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      
      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.2'
          bundler-cache: false
      
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y plantuml graphviz
          gem install asciidoctor asciidoctor-pdf --user-install
          echo "$HOME/.local/share/gem/ruby/3.2.0/bin" >> $GITHUB_PATH
      
      - name: Build diagrams
        run: make diagrams
      
      - name: Build PDFs
        run: make pdfs
      
      - name: Validate HTML
        run: |
          echo "HTML validation (requires W3C API)"
          # make validate-html  # Uncomment if needed
      
      - name: Archive artifacts
        uses: actions/upload-artifact@v4
        with:
          name: documentation
          path: |
            docs/*.pdf
            docs/images/*.png
