<svg xmlns="http://www.w3.org/2000/svg" width="88" height="24" viewBox="0 0 88 24" role="img" aria-labelledby="title-css">
  <title id="title-css">CSS Validation</title>
  <defs>
    <clipPath id="r2">
      <rect width="88" height="24" rx="4" ry="4" />
    </clipPath>
  </defs>
  <g clip-path="url(#r2)">
    <rect width="88" height="24" fill="#2b2b2b"/>
    <rect x="36" width="52" height="24" fill="#2965f1"/>
    <text x="18" y="16" fill="#fff" font-family="Arial, Helvetica, sans-serif" font-size="11" text-anchor="middle">CSS</text>
    <g>
      <text x="62" y="16" fill="#fff" font-family="Arial, Helvetica, sans-serif" font-size="11" text-anchor="middle">✓</text>
    </g>
  </g>
</svg>
