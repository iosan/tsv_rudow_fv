<?xml version="1.0" encoding="UTF-8"?>
<svg width="375" height="667" xmlns="http://www.w3.org/2000/svg">
  <!-- Mobile Layout Screenshot -->
  <title>Mobile Layout (≤480px)</title>
  
  <!-- Background -->
  <rect width="375" height="667" fill="#f4f4f4"/>
  
  <!-- Status Bar -->
  <rect width="375" height="20" fill="#000"/>
  <text x="20" y="14" font-family="Arial" font-size="10" fill="#fff">9:41</text>
  <text x="355" y="14" text-anchor="end" font-family="Arial" font-size="10" fill="#fff">📶 ⚡ 100%</text>
  
  <!-- Browser Chrome -->
  <rect y="20" width="375" height="25" fill="#e0e0e0"/>
  <text x="187" y="36" text-anchor="middle" font-family="Arial" font-size="10" fill="#666">TSV Rudow Foerderverein - Mobile</text>
  
  <!-- Fixed Navigation Bar (compact) -->
  <rect y="45" width="375" height="32" fill="#3d2f21"/>
  
  <!-- Logo in Nav (24px) -->
  <rect x="8" y="49" width="24" height="24" rx="2" fill="#ddd"/>
  <text x="20" y="64" text-anchor="middle" font-family="Arial" font-size="8" fill="#3d2f21">⚙</text>
  
  <!-- Navigation Menu Items (very compact) -->
  <rect x="110" y="51" width="50" height="26" rx="3" fill="rgba(255,255,255,0.2)" stroke="rgba(255,255,255,0.4)" stroke-width="1"/>
  <text x="135" y="67" text-anchor="middle" font-family="Arial" font-size="9" fill="#fff">Start</text>
  
  <rect x="165" y="51" width="60" height="26" rx="3" fill="transparent"/>
  <text x="195" y="67" text-anchor="middle" font-family="Arial" font-size="9" fill="#fff">Satzung</text>
  
  <rect x="228" y="51" width="68" height="26" rx="3" fill="transparent"/>
  <text x="262" y="67" text-anchor="middle" font-family="Arial" font-size="9" fill="#fff">Kontakt</text>
  
  <rect x="300" y="51" width="65" height="26" rx="3" fill="transparent"/>
  <text x="332" y="67" text-anchor="middle" font-family="Arial" font-size="9" fill="#fff">Aktuell</text>
  
  <!-- Header with Title (minimal gap) -->
  <rect y="77" width="375" height="38" fill="#3d2f21"/>
  <text x="187" y="98" text-anchor="middle" font-family="Arial" font-size="13" fill="#fff" font-weight="bold">TSV Rudow</text>
  <text x="187" y="110" text-anchor="middle" font-family="Arial" font-size="13" fill="#fff" font-weight="bold">Foerderverein</text>
  
  <!-- Main Content Area -->
  <rect y="115" width="375" height="552" fill="#f4f4f4"/>
  
  <!-- Content (compact) -->
  <text x="15" y="140" font-family="Arial" font-size="13" fill="#333" font-weight="bold">Foerderung fuer den</text>
  <text x="15" y="155" font-family="Arial" font-size="13" fill="#333" font-weight="bold">Herrenfussball</text>
  <text x="15" y="175" font-family="Arial" font-size="10" fill="#666">TSV Rudow I, II und III im Fokus</text>
  
  <!-- Gallery Grid (1 column, no rotation) -->
  <g transform="translate(97, 200)">
    <rect width="140" height="140" fill="#fff" rx="3" filter="url(#shadow)"/>
    <rect x="6" y="6" width="128" height="128" fill="#999"/>
    <text x="70" y="76" text-anchor="middle" font-family="Arial" font-size="12" fill="#fff">Philosophie</text>
  </g>
  
  <g transform="translate(97, 360)">
    <rect width="140" height="140" fill="#fff" rx="3" filter="url(#shadow)"/>
    <rect x="6" y="6" width="128" height="128" fill="#888"/>
    <text x="70" y="76" text-anchor="middle" font-family="Arial" font-size="12" fill="#fff">Satzung</text>
  </g>
  
  <g transform="translate(97, 520)">
    <rect width="140" height="140" fill="#fff" rx="3" filter="url(#shadow)"/>
    <rect x="6" y="6" width="128" height="128" fill="#777"/>
    <text x="70" y="76" text-anchor="middle" font-family="Arial" font-size="12" fill="#fff">Aktuelles</text>
  </g>
  
  <!-- Scroll indicator -->
  <text x="187" y="660" text-anchor="middle" font-family="Arial" font-size="9" fill="#999">⋮ Scroll for more</text>
  
  <!-- Shadow filter -->
  <defs>
    <filter id="shadow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="6"/>
      <feOffset dx="0" dy="6" result="offsetblur"/>
      <feComponentTransfer>
        <feFuncA type="linear" slope="0.25"/>
      </feComponentTransfer>
      <feMerge>
        <feMergeNode/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- Dimension indicator -->
  <text x="300" y="660" font-family="Arial" font-size="8" fill="#999">Mobile: 375×667px</text>
</svg>
