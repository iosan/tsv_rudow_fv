<?xml version="1.0" encoding="UTF-8"?>
<svg width="768" height="1024" xmlns="http://www.w3.org/2000/svg">
  <!-- Tablet Layout Screenshot -->
  <title>Tablet Layout (≤768px)</title>
  
  <!-- Background -->
  <rect width="768" height="1024" fill="#f4f4f4"/>
  
  <!-- Browser Chrome -->
  <rect width="768" height="30" fill="#e0e0e0"/>
  <circle cx="15" cy="15" r="5" fill="#ff5f56"/>
  <circle cx="30" cy="15" r="5" fill="#ffbd2e"/>
  <circle cx="45" cy="15" r="5" fill="#27c93f"/>
  <text x="384" y="20" text-anchor="middle" font-family="Arial" font-size="11" fill="#666">TSV Rudow Foerderverein - Tablet View</text>
  
  <!-- Fixed Navigation Bar (smaller) -->
  <rect y="30" width="768" height="40" fill="#3d2f21"/>
  
  <!-- Logo in Nav (28px) -->
  <rect x="15" y="36" width="28" height="28" rx="3" fill="#ddd"/>
  <text x="29" y="54" text-anchor="middle" font-family="Arial" font-size="9" fill="#3d2f21">⚙</text>
  
  <!-- Navigation Menu Items (smaller) -->
  <rect x="260" y="38" width="70" height="28" rx="3" fill="rgba(255,255,255,0.2)" stroke="rgba(255,255,255,0.4)" stroke-width="1"/>
  <text x="295" y="56" text-anchor="middle" font-family="Arial" font-size="12" fill="#fff">Startseite</text>
  
  <rect x="340" y="38" width="80" height="28" rx="3" fill="transparent"/>
  <text x="380" y="56" text-anchor="middle" font-family="Arial" font-size="12" fill="#fff">Satzung</text>
  
  <rect x="430" y="38" width="110" height="28" rx="3" fill="transparent"/>
  <text x="485" y="56" text-anchor="middle" font-family="Arial" font-size="12" fill="#fff">Kontakt</text>
  
  <rect x="550" y="38" width="90" height="28" rx="3" fill="transparent"/>
  <text x="595" y="56" text-anchor="middle" font-family="Arial" font-size="12" fill="#fff">Aktuelles</text>
  
  <!-- Header with Title (smaller gap) -->
  <rect y="70" width="768" height="50" fill="#3d2f21"/>
  <text x="384" y="100" text-anchor="middle" font-family="Arial" font-size="20" fill="#fff" font-weight="bold">TSV Rudow Foerderverein</text>
  
  <!-- Main Content Area -->
  <rect y="120" width="768" height="904" fill="#f4f4f4"/>
  
  <!-- Content (slightly smaller text) -->
  <text x="60" y="160" font-family="Arial" font-size="18" fill="#333" font-weight="bold">Foerderverein im Ueberblick</text>
  <text x="60" y="185" font-family="Arial" font-size="13" fill="#666">Unterstuetzung fuer TSV Rudow I, II und III</text>
  
  <!-- Gallery Grid (2 columns) -->
  <!-- Row 1 -->
  <g transform="translate(100, 220)">
    <rect width="180" height="180" fill="#fff" rx="4" filter="url(#shadow)"/>
    <rect x="8" y="8" width="164" height="164" fill="#999"/>
    <text x="90" y="100" text-anchor="middle" font-family="Arial" font-size="14" fill="#fff">Philosophie</text>
  </g>
  
  <g transform="translate(330, 220)">
    <rect width="180" height="180" fill="#fff" rx="4" filter="url(#shadow)"/>
    <rect x="8" y="8" width="164" height="164" fill="#888"/>
    <text x="90" y="100" text-anchor="middle" font-family="Arial" font-size="14" fill="#fff">Satzung</text>
  </g>
  
  <!-- Row 2 -->
  <g transform="translate(100, 430)">
    <rect width="180" height="180" fill="#fff" rx="4" filter="url(#shadow)"/>
    <rect x="8" y="8" width="164" height="164" fill="#777"/>
    <text x="90" y="100" text-anchor="middle" font-family="Arial" font-size="14" fill="#fff">Ansprechpartner</text>
  </g>
  
  <g transform="translate(330, 430)">
    <rect width="180" height="180" fill="#fff" rx="4" filter="url(#shadow)"/>
    <rect x="8" y="8" width="164" height="164" fill="#666"/>
    <text x="90" y="100" text-anchor="middle" font-family="Arial" font-size="14" fill="#fff">Beitritt</text>
  </g>
  
  <!-- Row 3 -->
  <g transform="translate(215, 640)">
    <rect width="180" height="180" fill="#fff" rx="4" filter="url(#shadow)"/>
    <rect x="8" y="8" width="164" height="164" fill="#555"/>
    <text x="90" y="100" text-anchor="middle" font-family="Arial" font-size="14" fill="#fff">Aktuelles</text>
  </g>
  
  <!-- Footer -->
  <rect y="860" width="768" height="164" fill="#3d2f21"/>
  <text x="384" y="900" text-anchor="middle" font-family="Arial" font-size="12" fill="#ddd">© 2026 TSV Rudow Foerderverein</text>
  <text x="384" y="930" text-anchor="middle" font-family="Arial" font-size="11" fill="#ddd">Kontakt: foerderverein@tsvrudow.de</text>
  <g transform="translate(284, 950)">
    <rect width="80" height="22" rx="2" fill="#4c1"/>
    <text x="40" y="15" text-anchor="middle" font-family="Arial" font-size="9" fill="#fff">✓ HTML5</text>
  </g>
  <g transform="translate(374, 950)">
    <rect width="80" height="22" rx="2" fill="#0c9"/>
    <text x="40" y="15" text-anchor="middle" font-family="Arial" font-size="9" fill="#fff">✓ CSS3</text>
  </g>
  
  <!-- Shadow filter -->
  <defs>
    <filter id="shadow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="8"/>
      <feOffset dx="0" dy="8" result="offsetblur"/>
      <feComponentTransfer>
        <feFuncA type="linear" slope="0.3"/>
      </feComponentTransfer>
      <feMerge>
        <feMergeNode/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- Dimension indicator -->
  <text x="670" y="1015" font-family="Arial" font-size="10" fill="#999">Tablet: 768×1024px</text>
</svg>
